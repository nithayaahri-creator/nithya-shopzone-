<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopZone | Modern E-Commerce</title>
    <style>
        /* Reset and Premium Typography */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background-color: #0f172a; /* Sophisticated Dark Slate Blue */
            color: #f8fafc;
            overflow-x: hidden;
        }

        /* Creative Navigation Bar */
        header {
            background-color: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.2rem 2rem;
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
            letter-spacing: -0.5px;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 2.5rem;
        }

        .nav-links a {
            text-decoration: none;
            color: #94a3b8;
            font-weight: 500;
            transition: color 0.3s, transform 0.2s;
        }

        .nav-links a:hover {
            color: #3b82f6;
        }

        .cart-icon-container {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(255, 255, 255, 0.05);
            padding: 0.6rem 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .cart-icon-container:hover {
            background: rgba(59, 130, 246, 0.15);
            border-color: #3b82f6;
            transform: translateY(-2px);
        }

        .cart-count {
            background: linear-gradient(135deg, #ef4444, #f43f5e);
            color: white;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 50px;
        }

        /* Creative Layout */
        .container {
            max-width: 1200px;
            margin: 3rem auto;
            padding: 0 2rem;
        }

        .section-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 2rem;
            letter-spacing: -0.5px;
        }

        /* Glassmorphism Product Cards */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }

        .product-card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            transform: translateY(-8px);
            border-color: rgba(59, 130, 246, 0.3);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
        }

        /* Responsive image container frame */
        .product-image-wrap {
            width: 100%;
            height: 240px;
            overflow: hidden;
            background: #1e293b;
            position: relative;
        }

        .product-image {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Prevents stretching */
            transition: transform 0.5s ease;
        }

        .product-card:hover .product-image {
            transform: scale(1.08); /* Modern dynamic zoom effect */
        }

        .product-info {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #f1f5f9;
        }

        .product-price {
            font-weight: 700;
            color: #60a5fa;
            font-size: 1.3rem;
            margin-bottom: 1.5rem;
        }

        .btn-add-cart {
            width: 100%;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            padding: 0.8rem;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-top: auto;
        }

        .btn-add-cart:hover {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        /* Slide-Out Cinematic Shopping Drawer */
        .cart-sidebar {
            position: fixed;
            top: 0;
            right: -400px; /* Hidden off-screen initially */
            width: 380px;
            height: 100vh;
            background: #1e293b;
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.5);
            z-index: 1000;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border-left: 1px solid rgba(255, 255, 255, 0.05);
        }

        .cart-sidebar.open {
            right: 0; /* Slides smoothly into frame */
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 1rem;
        }

        .cart-title {
            font-size: 1.4rem;
            font-weight: 700;
        }

        .close-cart {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 1.5rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-cart:hover {
            color: #f1f5f9;
        }

        .cart-items {
            list-style: none;
            margin-bottom: 1.5rem;
            max-height: calc(100vh - 280px);
            overflow-y: auto;
            flex-grow: 1;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.95rem;
            animation: fadeIn 0.3s ease;
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            font-size: 1.3rem;
            margin-top: 1rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            color: #f1f5f9;
        }

        .btn-checkout {
            width: 100%;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            padding: 0.9rem;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            margin-top: 1.5rem;
            transition: all 0.3s ease;
        }

        .btn-checkout:hover {
            background: linear-gradient(135deg, #34d399, #10b981);
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
        }

        /* Background overlay curtain when cart is open */
        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 999;
            display: none;
        }

        .sidebar-overlay.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="sidebar-overlay" id="cart-overlay" onclick="toggleCart(false)"></div>

    <header>
        <nav class="navbar">
            <a href="#" class="logo">ShopZone</a>
            <ul class="nav-links">
                <li><a href="#">Home</a></li>
                <li><a href="#">Products</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
            <div class="cart-icon-container" onclick="toggleCart(true)">
                <span>🛒 Cart</span>
                <span class="cart-count" id="cart-icon-count">0</span>
            </div>
        </nav>
    </header>

    <main class="container">
        
        <h2 class="section-title">Featured Products</h2>
        <div class="products-grid">
            
            <div class="product-card">
                <div class="product-image-wrap">
                    <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500&q=80" alt="Wireless Headphones" class="product-image">
                </div>
                <div class="product-info">
                    <h3 class="product-title">Wireless Headphones</h3>
                    <p class="product-price">$99.99</p>
                    <button class="btn-add-cart" onclick="addToCart('Wireless Headphones', 99.99)">Add to Cart</button>
                </div>
            </div>

            <div class="product-card">
                <div class="product-image-wrap">
                    <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500&q=80" alt="Smart Watch" class="product-image">
                </div>
                <div class="product-info">
                    <h3 class="product-title">Smart Watch</h3>
                    <p class="product-price">$149.99</p>
                    <button class="btn-add-cart" onclick="addToCart('Smart Watch', 149.99)">Add to Cart</button>
                </div>
            </div>

            <div class="product-card">
                <div class="product-image-wrap">
                    <img src="https://images.unsplash.com/photo-1548036328-c9fa89d128fa?w=500&q=80" alt="Leather Backpack" class="product-image">
                </div>
                <div class="product-info">
                    <h3 class="product-title">Leather Backpack</h3>
                    <p class="product-price">$79.99</p>
                    <button class="btn-add-cart" onclick="addToCart('Leather Backpack', 79.99)">Add to Cart</button>
                </div>
            </div>

        </div>

    </main>

    <aside class="cart-sidebar" id="cart-sidebar">
        <div class="cart-header">
            <h3 class="cart-title">Your Cart</h3>
            <button class="close-cart" onclick="toggleCart(false)">&times;</button>
        </div>
        <ul class="cart-items" id="cart-items-list">
            </ul>
        <div class="cart-total">
            <span>Total:</span>
            <span id="cart-total-price">$0.00</span>
        </div>
        <button class="btn-checkout" onclick="checkout()">Proceed to Checkout</button>
    </aside>

    <script>
        let cart = [];

        // Smooth Sidebar Toggler
        function toggleCart(open) {
            const sidebar = document.getElementById('cart-sidebar');
            const overlay = document.getElementById('cart-overlay');
            if (open) {
                sidebar.classList.add('open');
                overlay.classList.add('active');
            } else {
                sidebar.classList.remove('open');
                overlay.classList.remove('active');
            }
        }

        function addToCart(name, price) {
            cart.push({ name, price });
            updateCartUI();
            
            // Auto open the slide-out drawer smoothly
            toggleCart(true);
        }

        function updateCartUI() {
            const listElement = document.getElementById('cart-items-list');
            const totalElement = document.getElementById('cart-total-price');
            const countElement = document.getElementById('cart-icon-count');
            
            listElement.innerHTML = '';
            let total = 0;
            
            cart.forEach(item => {
                const li = document.createElement('li');
                li.className = 'cart-item';
                li.innerHTML = `<span>${item.name}</span> <span style="color:#60a5fa; font-weight:600;">$${item.price.toFixed(2)}</span>`;
                listElement.appendChild(li);
                total += item.price;
            });
            
            totalElement.innerText = `$${total.toFixed(2)}`;
            countElement.innerText = cart.length;
        }

        function checkout() {
            if(cart.length === 0) {
                alert("Your cart is empty!");
            } else {
                alert("🎉 Thank you for your purchase! Processing your order...");
                cart = [];
                updateCartUI();
                toggleCart(false); // Close cart drawer neatly on completion
            }
        }
    </script>
</body>
</html>
